<script id="timer">
/* ====================== FOCUS TIMER ====================== */
const TM = (() => {
  if (typeof document === 'undefined' || !document.getElementById('land')) return { show(){} };
  const $ = id => document.getElementById(id);
  const K = 'amcprep.timer.';
  const MIN = 10, MAX = 360, STEP = 5, BREAK = 5, RING_C = 2 * Math.PI * 97, TZ = 'America/New_York';
  const store = {
    get(k, d){ try{ const v = localStorage.getItem(K + k); return v ? JSON.parse(v) : d; }catch(e){ return d; } },
    set(k, v){ try{ localStorage.setItem(K + k, JSON.stringify(v)); }catch(e){} }
  };
  const clampSel = v => Math.min(MAX, Math.max(MIN, Math.round(v)));
  let state = store.get('state', { mode:'idle' });
  let hist = store.get('history', []);
  let pos = store.get('pos', { fx:1, fy:0 });          // widget position as fractions of free space
  let selected = clampSel(store.get('last', 25));
  let onLanding = false;
  const save = () => store.set('state', state);
  const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

  // ---------- sound effects (synthesized, no files) ----------
  const sfx = (() => {
    let ctx = null, master = null, muted = store.get('muted', false);
    function ensure(){
      try{
        if (!ctx){ ctx = new (window.AudioContext || window.webkitAudioContext)(); master = ctx.createGain(); master.gain.value = .9; master.connect(ctx.destination); }
        if (ctx.state === 'suspended') ctx.resume();
      }catch(e){}
      return ctx;
    }
    function tone(f, dur, o = {}){
      if (muted || !ensure()) return;
      const t = ctx.currentTime + (o.delay || 0);
      const osc = ctx.createOscillator(), g = ctx.createGain();
      osc.type = o.type || 'sine';
      osc.frequency.setValueAtTime(f, t);
      if (o.to) osc.frequency.exponentialRampToValueAtTime(o.to, t + dur);
      g.gain.setValueAtTime(0, t);
      g.gain.linearRampToValueAtTime(o.gain ?? .12, t + (o.attack || .008));
      g.gain.exponentialRampToValueAtTime(.0001, t + dur);
      osc.connect(g).connect(master); osc.start(t); osc.stop(t + dur + .05);
    }
    function whoosh(dur, o = {}){
      if (muted || !ensure()) return;
      const t = ctx.currentTime + (o.delay || 0);
      const len = Math.floor(ctx.sampleRate * dur);
      const buf = ctx.createBuffer(1, len, ctx.sampleRate), d = buf.getChannelData(0);
      for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
      const src = ctx.createBufferSource(); src.buffer = buf;
      const bp = ctx.createBiquadFilter(); bp.type = 'bandpass'; bp.Q.value = 1.2;
      bp.frequency.setValueAtTime(o.from || 400, t);
      bp.frequency.exponentialRampToValueAtTime(o.to || 3000, t + dur);
      const g = ctx.createGain();
      g.gain.setValueAtTime(0, t);
      g.gain.linearRampToValueAtTime(o.gain ?? .06, t + dur * .35);
      g.gain.exponentialRampToValueAtTime(.0001, t + dur);
      src.connect(bp).connect(g).connect(master); src.start(t); src.stop(t + dur + .05);
    }
    return {
      unlock: ensure,
      get muted(){ return muted; },
      setMuted(v){ muted = v; store.set('muted', v); },
      tap(){ tone(1400, .05, {type:'triangle', gain:.05}); },
      key(){ tone(1800, .025, {type:'triangle', gain:.025}); },
      tick(){ tone(2400, .02, {type:'triangle', gain:.03}); },
      open(){ tone(520, .18, {gain:.08}); tone(780, .22, {gain:.07, delay:.07}); },
      close(){ tone(780, .16, {gain:.06}); tone(520, .2, {gain:.06, delay:.06}); },
      invalid(){ tone(200, .16, {type:'triangle', gain:.1}); tone(170, .2, {type:'triangle', gain:.09, delay:.1}); },
      start(){ whoosh(1.4, {from:300, to:4000, gain:.06}); tone(392, 1.6, {gain:.07, to:196, attack:.05}); tone(784, .9, {gain:.035, delay:.35, attack:.02}); },
      pause(){ tone(660, .14, {gain:.08}); tone(494, .22, {gain:.08, delay:.1}); },
      resume(){ tone(494, .14, {gain:.08}); tone(660, .22, {gain:.08, delay:.1}); },
      arm(){ tone(330, .22, {type:'triangle', gain:.09}); },
      end(){ [523.25, 440, 329.63].forEach((f, i) => tone(f, .4, {gain:.08, delay:i*.12})); },
      complete(){ [659.25, 783.99, 1046.5].forEach((f, i) => tone(f, 1.4, {gain:.14, delay:i*.28, attack:.02})); if (navigator.vibrate) navigator.vibrate([120, 80, 120]); },
      breakStart(){ tone(587.33, .2, {gain:.07}); tone(880, .35, {gain:.06, delay:.1}); },
      breakEnd(){ [880, 659.25].forEach((f, i) => tone(f, .9, {gain:.1, delay:i*.25, attack:.02})); },
      unmute(){ tone(880, .12, {gain:.06}); tone(1175, .16, {gain:.05, delay:.06}); }
    };
  })();
  document.addEventListener('pointerdown', () => sfx.unlock(), {once:true});

  // ---------- formatting ----------
  function fmtDur(min){ const h = Math.floor(min/60), m = min % 60; if (!h) return m + ' min'; return m ? `${h} hr ${m} min` : `${h} hr`; }
  function fmtClock(ms){
    const t = Math.max(0, Math.ceil(ms/1000)), h = Math.floor(t/3600), m = Math.floor(t%3600/60), s = t%60;
    return h ? `${h}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}` : `${m}:${String(s).padStart(2,'0')}`;
  }
  function fmtExact(ms){ const t = Math.round(ms/1000), h = Math.floor(t/3600), m = Math.floor(t%3600/60), s = t%60;
    return (h ? h + ' hr ' : '') + (h || m ? m + ' min ' : '') + s + ' s'; }
  const minutes = ms => ms < 60000 ? '<1 min' : Math.round(ms/60000) + ' min';
  function parseTyped(str){
    str = str.trim().toLowerCase(); if (!str) return null;
    let m = str.match(/^(\d{1,2}):(\d{1,2})$/); if (m) return (+m[1])*60 + (+m[2]);
    m = str.match(/^(?:(\d+(?:\.\d+)?)\s*h(?:r|rs|ours?)?)?\s*(?:(\d+)\s*(?:m(?:in(?:ute)?s?)?)?)?$/);
    if (m && (m[1] || m[2])) return Math.round((+(m[1]||0))*60 + (+(m[2]||0)));
    return NaN;
  }
  const etTime = (ms, sec) => new Intl.DateTimeFormat('en-US', {timeZone:TZ, hour:'numeric', minute:'2-digit', second: sec ? '2-digit' : undefined}).format(ms);
  const etZone = ms => (new Intl.DateTimeFormat('en-US', {timeZone:TZ, timeZoneName:'short'}).formatToParts(ms).find(p => p.type === 'timeZoneName') || {}).value || 'ET';
  const etDate = (ms, long) => new Intl.DateTimeFormat('en-US', long ? {timeZone:TZ, weekday:'long', month:'long', day:'numeric', year:'numeric'} : {timeZone:TZ, weekday:'short', month:'short', day:'numeric', year:'numeric'}).format(ms);
  function oneSentence(s){
    s = (s || '').replace(/\s+/g, ' ').trim(); if (!s) return '';
    const m = s.match(/^.*?[.!?](?=\s|$)/); const first = m ? m[0] : s;
    return first.length < s.length ? first.replace(/[.!?]$/, '') + '…' : first;
  }

  // ---------- analog clock ----------
  const ticksG = $('tmTicks');
  for (let i = 0; i < 60; i++){
    const major = i % 5 === 0, quarter = i % 15 === 0, a = i * 6 * Math.PI / 180;
    const r1 = quarter ? 74 : major ? 77 : 82, r2 = 85;
    const l = document.createElementNS('http://www.w3.org/2000/svg','line');
    l.setAttribute('x1', 100 + r1*Math.sin(a)); l.setAttribute('y1', 100 - r1*Math.cos(a));
    l.setAttribute('x2', 100 + r2*Math.sin(a)); l.setAttribute('y2', 100 - r2*Math.cos(a));
    l.setAttribute('class','tm-tick'); l.setAttribute('stroke-width', quarter ? 2.4 : major ? 1.6 : .6);
    if (!major) l.style.opacity = .5;
    ticksG.appendChild(l);
  }
  const ring = $('tmRing'); ring.style.strokeDasharray = RING_C;
  function drawClock(){
    const n = new Date(), s = n.getSeconds(), m = n.getMinutes() + s/60, h = (n.getHours()%12) + m/60;
    $('tmH').setAttribute('transform', `rotate(${h*30} 100 100)`);
    $('tmM').setAttribute('transform', `rotate(${m*6} 100 100)`);
    $('tmS').setAttribute('transform', `rotate(${s*6} 100 100)`);
  }

  // ---------- timer logic ----------
  const remaining = () => state.paused ? state.remaining : state.endAt - Date.now();
  function tick(){
    if (onLanding) drawClock();
    if (state.mode === 'idle') return;
    const r = remaining(), frac = Math.max(0, r) / state.total, txt = fmtClock(r);
    $('tmTime').textContent = txt; $('tmwTime').textContent = txt;
    ring.style.strokeDashoffset = RING_C * (1 - frac);
    $('tmwBar').style.width = ((1 - frac) * 100) + '%';
    if (r <= 0) finish();
  }
  function startSession(mode, mins, desc){
    state = { mode, total: mins*60000, endAt: Date.now() + mins*60000, paused:false, leaves:0, startedAt: Date.now(), desc: desc || '' };
    save();
    mode === 'focus' ? sfx.start() : sfx.breakStart();
    wake(true); render(); tick();
  }
  function togglePause(){
    if (state.mode === 'idle') return;
    if (state.paused){ state.endAt = Date.now() + state.remaining; state.paused = false; wake(true); sfx.resume(); }
    else { state.remaining = state.endAt - Date.now(); state.paused = true; wake(false); sfx.pause(); }
    save(); render(); tick();
  }
  function record(was, end, focusedMs, completed){
    if (focusedMs < 1000) return;
    hist.push({ start: was.startedAt, end, focused: focusedMs, planned: Math.round(was.total/60000), desc: was.desc || '', done: completed, leaves: was.leaves || 0 });
    store.set('history', hist);
  }
  function finish(){
    const was = state;
    const end = was.paused ? Date.now() : Math.min(Date.now(), was.endAt);
    state = { mode:'idle' }; save(); wake(false); disarm();
    if (was.mode === 'focus'){
      sfx.complete(); record(was, end, was.total, true);
      $('tmDoneTitle').textContent = 'Session complete';
      $('tmDoneMsg').innerHTML = `You studied for ${fmtDur(Math.round(was.total/60000))}.` + (was.desc ? `<br><i>${esc(oneSentence(was.desc))}</i>` : '') +
        (was.leaves ? `<br>You left the page ${was.leaves} time${was.leaves > 1 ? 's' : ''}.` : '<br>No interruptions.');
      $('tmBreak').classList.remove('hidden');
    } else {
      sfx.breakEnd();
      $('tmDoneTitle').textContent = 'Break is over';
      $('tmDoneMsg').textContent = 'Ready for another focus session?';
      $('tmBreak').classList.add('hidden');
    }
    render(); openSheet($('tmDone'), true);
  }
  let endArmed = null;
  const endBtns = () => [$('tmEnd'), $('tmwEnd')];
  function endEarly(){
    if (!endArmed){
      endBtns().forEach(b => { b.textContent = b.id === 'tmEnd' ? 'Tap to confirm' : 'Confirm'; b.classList.add('warn'); });
      endArmed = setTimeout(disarm, 3000); sfx.arm(); return;
    }
    disarm(); sfx.end();
    if (state.mode === 'focus') record(state, Date.now(), state.total - Math.max(0, remaining()), false);
    state = { mode:'idle' }; save(); wake(false); render();
  }
  function disarm(){ clearTimeout(endArmed); endArmed = null; endBtns().forEach(b => { b.textContent = 'End'; b.classList.remove('warn'); }); }

  // ---------- view ----------
  function render(){
    const active = state.mode !== 'idle', focus = state.mode === 'focus';
    const label = !active ? '' : state.paused ? 'Paused' : focus ? 'Focus' : 'Break';
    document.body.classList.toggle('tm-running', active);
    $('tmTimer').classList.toggle('show', active);
    $('tmLabel').textContent = label;
    $('tmDescShow').textContent = active && focus ? oneSentence(state.desc) : '';
    $('tmSet').classList.toggle('hidden', active);
    $('tmPause').classList.toggle('hidden', !active);
    $('tmEnd').classList.toggle('hidden', !active);
    $('tmPause').textContent = $('tmwPause').textContent = state.paused ? 'Resume' : 'Pause';
    const go = $('tmGo'); go.textContent = active ? 'Back to studying →' : 'Browse topics without a timer'; go.classList.toggle('primary', active);
    const w = $('tmw');
    w.hidden = !active || onLanding;
    w.classList.toggle('focus', focus && !state.paused);
    $('tmwLabel').textContent = label;
    $('tmwDesc').textContent = focus ? (oneSentence(state.desc) || 'Focus session') : 'Take a breather';
    if (!active){ ring.style.strokeDashoffset = 0; }
    if (!w.hidden) placeWidget();
    renderStats();
  }
  function renderStats(){
    const today = new Date().toDateString();
    const t = hist.filter(h => new Date(h.start).toDateString() === today);
    const mins = Math.round(t.reduce((a, h) => a + h.focused, 0) / 60000);
    $('tmStats').textContent = t.length ? `Today ${fmtDur(mins)}  ·  ${t.length} session${t.length > 1 ? 's' : ''}` : 'Nothing studied yet today';
  }
  const MUTE_ON = '<svg viewBox="0 0 24 24"><path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z"/><path d="M15.5 9a4 4 0 0 1 0 6"/><path d="M18 6.5a7.5 7.5 0 0 1 0 11"/></svg>';
  const MUTE_OFF = '<svg viewBox="0 0 24 24"><path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z"/><path d="M16 9.5l5 5M21 9.5l-5 5"/></svg>';
  function renderMute(){ document.querySelectorAll('.tm-mute').forEach(b => { b.innerHTML = sfx.muted ? MUTE_OFF : MUTE_ON; b.setAttribute('aria-label', sfx.muted ? 'Unmute sounds' : 'Mute sounds'); }); }
  document.querySelectorAll('.tm-mute').forEach(b => b.addEventListener('click', () => { sfx.setMuted(!sfx.muted); if (!sfx.muted) sfx.unmute(); renderMute(); }));

  // ---------- draggable widget ----------
  const w = $('tmw'), M = 10;
  function bounds(){ const r = w.getBoundingClientRect(); return { mx: Math.max(0, innerWidth - r.width - 2*M), my: Math.max(0, innerHeight - r.height - 2*M) }; }
  function placeWidget(){ const b = bounds(); w.style.left = (M + b.mx * pos.fx) + 'px'; w.style.top = (M + b.my * pos.fy) + 'px'; }
  let drag = null;
  w.addEventListener('pointerdown', e => {
    if (e.target.closest('button') || e.button > 0) return;
    const r = w.getBoundingClientRect();
    drag = { dx: e.clientX - r.left, dy: e.clientY - r.top };
    w.setPointerCapture(e.pointerId); w.classList.add('drag');
  });
  w.addEventListener('pointermove', e => {
    if (!drag) return;
    const b = bounds();
    const x = Math.min(M + b.mx, Math.max(M, e.clientX - drag.dx)), y = Math.min(M + b.my, Math.max(M, e.clientY - drag.dy));
    w.style.left = x + 'px'; w.style.top = y + 'px';
    pos = { fx: b.mx ? (x - M) / b.mx : 0, fy: b.my ? (y - M) / b.my : 0 };
  });
  const endDrag = () => { if (!drag) return; drag = null; w.classList.remove('drag'); store.set('pos', pos); };
  w.addEventListener('pointerup', endDrag); w.addEventListener('pointercancel', endDrag);
  window.addEventListener('resize', () => { if (!w.hidden) placeWidget(); });
  $('tmwPause').addEventListener('click', togglePause);
  $('tmwEnd').addEventListener('click', endEarly);
  $('tmwOpen').addEventListener('click', () => { location.hash = '#/'; });

  // ---------- sheets ----------
  let openEl = null;
  function openSheet(el, silent){
    if (openEl && openEl !== el) closeSheet(true);
    openEl = el; if (!silent) sfx.open();
    $('tmBackdrop').classList.add('open'); el.style.transform = ''; el.classList.add('open');
  }
  function closeSheet(silent){
    if (!openEl) return;
    if (silent !== true) sfx.close();
    if (document.activeElement && document.activeElement.blur) document.activeElement.blur();
    const el = openEl; openEl = null; el.style.transform = ''; el.classList.remove('open');
    $('tmBackdrop').classList.remove('open');
  }
  document.querySelectorAll('.tm-sheet').forEach(sheet => {     // drag a sheet down by its handle to dismiss
    let y0 = null, dy = 0;
    sheet.querySelectorAll('.tm-grab, .tm-head').forEach(h => {
      h.addEventListener('touchstart', e => { if (e.target.closest('button')) return; y0 = e.touches[0].clientY; dy = 0; sheet.style.transition = 'none'; }, {passive:true});
      h.addEventListener('touchmove', e => { if (y0 === null) return; dy = Math.max(0, e.touches[0].clientY - y0); sheet.style.transform = `translateY(${dy}px)`; }, {passive:true});
      h.addEventListener('touchend', () => { if (y0 === null) return; sheet.style.transition = ''; if (dy > 80) closeSheet(); else sheet.style.transform = ''; y0 = null; });
    });
  });
  $('tmBackdrop').addEventListener('click', closeSheet);
  document.addEventListener('keydown', e => { if (e.key === 'Escape' && openEl) closeSheet(); });

  // ---------- Focus Time menu ----------
  const slider = $('tmSlider'), typed = $('tmTyped'), hint = $('tmHint'), startBtn = $('tmStart'), descEl = $('tmDesc');
  const vals = [MIN]; for (let x = MIN + STEP; x < MAX; x += STEP) vals.push(x); vals.push(MAX);
  slider.max = vals.length - 1; $('tmEndMin').textContent = fmtDur(MIN); $('tmEndMax').textContent = fmtDur(MAX);
  const nearest = v => { let b = 0; for (let i = 1; i < vals.length; i++) if (Math.abs(vals[i]-v) < Math.abs(vals[b]-v)) b = i; return b; };
  function setSelected(v, fromSlider){
    selected = v; $('tmReadout').textContent = fmtDur(v);
    slider.value = nearest(v); slider.style.setProperty('--p', (slider.value / (vals.length - 1) * 100) + '%');
    if (fromSlider) typed.value = '';
    hint.textContent = ' '; hint.classList.remove('err'); startBtn.disabled = false;
  }
  let lastStep = -1, wasInvalid = false;
  slider.addEventListener('input', () => { if (+slider.value !== lastStep){ lastStep = +slider.value; sfx.tick(); } wasInvalid = false; setSelected(vals[+slider.value], true); });
  typed.addEventListener('input', () => {
    sfx.key();
    const v = parseTyped(typed.value);
    if (v === null){ wasInvalid = false; setSelected(vals[+slider.value], false); return; }
    if (isNaN(v) || v < MIN || v > MAX){
      if (!wasInvalid) sfx.invalid(); wasInvalid = true;
      hint.textContent = `Choose between ${fmtDur(MIN)} and ${fmtDur(MAX)}`; hint.classList.add('err'); startBtn.disabled = true; return;
    }
    wasInvalid = false; setSelected(v, false); lastStep = +slider.value;
  });
  typed.addEventListener('keydown', e => { if (e.key === 'Enter'){ e.preventDefault(); descEl.focus(); } });
  descEl.addEventListener('input', () => { sfx.key(); $('tmCount').textContent = descEl.value.length + ' / 500'; });
  $('tmSet').addEventListener('click', () => { lastStep = -1; setSelected(selected, true); $('tmCount').textContent = descEl.value.length + ' / 500'; openSheet($('tmSheet')); });
  $('tmCancel').addEventListener('click', closeSheet);
  startBtn.addEventListener('click', () => {
    sfx.unlock(); store.set('last', selected);
    const desc = descEl.value.trim();
    closeSheet(true); descEl.value = '';
    startSession('focus', selected, desc);
    setTimeout(() => { location.hash = '#/home'; }, 450);
  });
  $('tmPause').addEventListener('click', togglePause);
  $('tmEnd').addEventListener('click', endEarly);
  $('tmGo').addEventListener('click', () => { location.hash = '#/home'; });
  $('tmDoneOk').addEventListener('click', closeSheet);
  $('tmNew').addEventListener('click', () => { closeSheet(true); location.hash = '#/'; setTimeout(() => $('tmSet').click(), 350); });
  $('tmBreak').addEventListener('click', () => { sfx.unlock(); closeSheet(true); startSession('break', BREAK, ''); });

  // ---------- history ----------
  const hb = $('tmHistBody');
  function histList(){
    $('tmHistTitle').textContent = 'Study History'; $('tmHistBack').style.visibility = 'hidden';
    if (!hist.length){ hb.innerHTML = '<div class="tm-empty">No study sessions yet.<br>Set a focus time and press Start. Each session will appear here.</div>'; return; }
    const total = hist.reduce((a, h) => a + h.focused, 0);
    let html = `<div class="tm-sum"><div><b>${hist.length}</b><span>sessions</span></div><div><b>${fmtDur(Math.round(total/60000))}</b><span>total studied</span></div></div>`;
    let day = '';
    hist.map((h, i) => [h, i]).reverse().forEach(([h, i]) => {
      const d = etDate(h.start);
      if (d !== day){ day = d; html += `<div class="tm-day">${esc(d)}</div>`; }
      const desc = oneSentence(h.desc);
      html += `<button class="tm-hrow" data-i="${i}"><div class="tm-hmain"><span class="tm-htime">${etTime(h.start)} – ${etTime(h.end)}<small>${etZone(h.start)}</small></span><span class="tm-hdur">${minutes(h.focused)}</span></div>
        <div class="tm-hdesc">${desc ? esc(desc) : '<i>No description</i>'}</div></button>`;
    });
    hb.innerHTML = html; hb.scrollTop = 0;
  }
  function histDetail(i){
    const h = hist[i]; if (!h) return histList();
    $('tmHistTitle').textContent = 'Session Details'; $('tmHistBack').style.visibility = 'visible';
    const z = etZone(h.start), z2 = etZone(h.end);
    hb.innerHTML = `<div class="tm-dbig">${minutes(h.focused)}</div><div class="tm-dsub">studied · ${h.done ? 'completed' : 'ended early'}</div>
      <dl class="tm-dl">
        <dt>Date</dt><dd>${esc(etDate(h.start, true))}</dd>
        <dt>Started</dt><dd>${etTime(h.start, true)} ${z}</dd>
        <dt>Ended</dt><dd>${etTime(h.end, true)} ${z2}${etDate(h.end) !== etDate(h.start) ? ' (' + esc(etDate(h.end)) + ')' : ''}</dd>
        <dt>Time studied</dt><dd>${fmtExact(h.focused)}</dd>
        <dt>Start to end</dt><dd>${fmtExact(h.end - h.start)}${h.end - h.start - h.focused > 1500 ? ' (includes pauses)' : ''}</dd>
        <dt>Planned</dt><dd>${fmtDur(h.planned)}</dd>
        <dt>Time zone</dt><dd>Eastern Time (${z})</dd>
      </dl>
      <div class="tm-dh">Description</div><p class="tm-dfull">${h.desc ? esc(h.desc) : '<i>No description was written for this session.</i>'}</p>
      <button class="tm-btn tm-del" id="tmDel">Delete this session</button>`;
    hb.scrollTop = 0;
    let armed = false;
    $('tmDel').addEventListener('click', e => {
      if (!armed){ armed = true; e.target.textContent = 'Tap again to delete'; e.target.classList.add('warn'); sfx.arm(); return; }
      hist.splice(i, 1); store.set('history', hist); sfx.end(); renderStats(); histList();
    });
  }
  hb.addEventListener('click', e => { const r = e.target.closest('.tm-hrow'); if (r){ sfx.tap(); histDetail(+r.dataset.i); } });
  $('tmHistBtn').addEventListener('click', () => { histList(); openSheet($('tmHist')); });
  $('tmHistBack').addEventListener('click', () => { sfx.tap(); histList(); });
  $('tmHistClose').addEventListener('click', closeSheet);

  // ---------- keep screen awake / leaving the page ----------
  let lock = null;
  async function wake(on){
    try{
      if (on && !lock && 'wakeLock' in navigator){ lock = await navigator.wakeLock.request('screen'); lock.addEventListener('release', () => { lock = null; }); }
      else if (!on && lock){ await lock.release(); lock = null; }
    }catch(e){}
  }
  document.addEventListener('visibilitychange', () => {
    if (document.hidden){ if (state.mode === 'focus' && !state.paused){ state.leaves = (state.leaves || 0) + 1; save(); } }
    else { if (state.mode !== 'idle' && !state.paused) wake(true); tick(); }
  });

  // ---------- boot ----------
  renderMute(); render(); tick(); setInterval(tick, 250);
  return {
    show(landing){ onLanding = landing; if (landing) drawClock(); render(); tick(); }
  };
})();
</script>
<script id="main">

'use strict';
/* ====================== utilities ====================== */
const T = String.raw;
const KEY = 'amc1012prep.v1';
function hash(s){let h=2166136261>>>0;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)}return h>>>0}
function rng(a){a=a>>>0;return function(){a=(a+0x6D2B79F5)|0;let t=Math.imul(a^(a>>>15),1|a);t=(t+Math.imul(t^(t>>>7),61|t))^t;return((t^(t>>>14))>>>0)/4294967296}}
const ri=(r,a,b)=>a+Math.floor(r()*(b-a+1));
const pick=(r,a)=>a[Math.floor(r()*a.length)];
function shuffle(r,a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function gcd(a,b){a=Math.abs(a);b=Math.abs(b);while(b){[a,b]=[b,a%b]}return a}
class Fr{
  constructor(n,d=1){if(d===0)throw new Error('zero denominator');if(d<0){n=-n;d=-d}const g=gcd(n,d)||1;this.n=n/g;this.d=d/g}
  static of(x){return x instanceof Fr?x:new Fr(x,1)}
  add(o){o=Fr.of(o);return new Fr(this.n*o.d+o.n*this.d,this.d*o.d)}
  sub(o){o=Fr.of(o);return new Fr(this.n*o.d-o.n*this.d,this.d*o.d)}
  mul(o){o=Fr.of(o);return new Fr(this.n*o.n,this.d*o.d)}
  div(o){o=Fr.of(o);return new Fr(this.n*o.d,this.d*o.n)}
  neg(){return new Fr(-this.n,this.d)}
  pow(k){let r=new Fr(1);for(let i=0;i<k;i++)r=r.mul(this);return r}
  get v(){return this.n/this.d}
  isInt(){return this.d===1}
  tex(){if(this.d===1)return String(this.n);return(this.n<0?'-':'')+'\\frac{'+Math.abs(this.n)+'}{'+this.d+'}'}
}
const F=(n,d=1)=>new Fr(n,d);
const tx=x=>x instanceof Fr?x.tex():String(x);
const isNeg=x=>x instanceof Fr?x.n<0:x<0;
const P=x=>isNeg(x)?'\\left('+tx(x)+'\\right)':tx(x);       // parenthesize negatives
function ord(n){const s=['th','st','nd','rd'],v=n%100;return n+(s[(v-20)%10]||s[v]||s[0])}
function seriesStr(ts){let s=tx(ts[0]);for(let i=1;i<ts.length;i++){const t=Fr.of(ts[i]);s+=t.n<0?' - '+t.neg().tex():' + '+t.tex()}return s}
function poly(cs,v='n'){ // cs: [[coef,power],...] -> tex
  let s='';for(const [c,p] of cs){if(!c)continue;const a=Math.abs(c);const var_=p===0?'':p===1?v:v+'^'+p;
    const body=(a===1&&p!==0)?var_:a+var_;s+=(s===''?(c<0?'-':''):(c<0?' - ':' + '))+body}return s||'0'}

/* turn generator output into 5 sorted answer choices */
function toOpt(x){if(x==null)return null;if(x instanceof Fr)return{tex:x.tex(),v:x.v};if(typeof x==='number')return Number.isFinite(x)?{tex:String(x),v:x}:null;return x}
function build(a,ws){
  const c=toOpt(a);const opts=[c];const seenT=new Set([c.tex]);const seenV=new Set([c.v]);
  const add=o=>{if(!o||!Number.isFinite(o.v)||seenT.has(o.tex)||seenV.has(o.v))return;seenT.add(o.tex);seenV.add(o.v);opts.push(o)};
  for(const w of ws){if(opts.length>=5)break;add(toOpt(w))}
  let k=1;
  while(opts.length<5&&k<80&&(typeof a==='number'||a instanceof Fr)){
    const base=Fr.of(a);const step=base.isInt()?F(1):F(1,base.d);const m=Math.ceil(k/2);
    const s=k%2?base.add(step.mul(m)):base.sub(step.mul(m));
    add(toOpt(typeof a==='number'?s.v:s));k++;
  }
  const mods=[[t=>String.raw`2\left(`+t+String.raw`\right)`,v=>2*v],[t=>String.raw`\tfrac{1}{2}\left(`+t+String.raw`\right)`,v=>v/2],[t=>t+'+1',v=>v+1],[t=>t+'-1',v=>v-1],[t=>String.raw`-\left(`+t+String.raw`\right)`,v=>-v],[t=>t+'+2',v=>v+2]];
  for(const [ft,fv] of mods){if(opts.length>=5)break;add({tex:ft(c.tex),v:fv(c.v)})}
  opts.sort((x,y)=>x.v-y.v);
  return{choices:opts.map(o=>'$'+o.tex+'$'),ans:opts.indexOf(c)};
}

GENS.arith=[
r=>{let d=0;while(!d)d=ri(r,-9,12);const a1=ri(r,-20,40),p=ri(r,2,8),q=p+ri(r,3,9),s=q+ri(r,5,40);const t=n=>a1+(n-1)*d;const ap=t(p),aq=t(q),as=t(s);
 return{lvl:1,q:T`In an arithmetic sequence, the ${ord(p)} term is $${ap}$ and the ${ord(q)} term is $${aq}$. What is the ${ord(s)} term?`,
 a:as,w:[as+d,as-d,as+2*d,a1+s*d,aq+(s-q)*(d+1)],
 s:T`From term ${p} to term ${q} is ${q-p} steps: $${q-p}d=${aq}-${P(ap)}=${aq-ap}$, so $d=${d}$.<br>From term ${q} to term ${s} is ${s-q} more steps: $a_{${s}}=a_{${q}}+${s-q}d=${aq}+${s-q}\cdot${P(d)}=${as}$.<br><b>Key idea:</b> $a_m-a_n=(m-n)d$. You never need $a_1$.`}},
r=>{const a=ri(r,-30,40),d=ri(r,2,13),n=ri(r,25,250),L=a+(n-1)*d;
 return{lvl:1,q:T`How many terms are in the arithmetic sequence $${a},\ ${a+d},\ ${a+2*d},\ \dots,\ ${L}$?`,
 a:n,w:[n-1,n+1,n-2,n+2],
 s:T`The common difference is $d=${d}$. Number of terms $=\dfrac{\text{last}-\text{first}}{d}+1=\dfrac{${L}-${P(a)}}{${d}}+1=${n-1}+1=${n}$.<br><b>Trap:</b> forgetting the $+1$ (fencepost error) gives $${n-1}$.`}},
r=>{let d=0;while(!d)d=ri(r,-6,9);const a1=ri(r,-15,25),n=ri(r,10,60),an=a1+(n-1)*d,S=n*(a1+an)/2;
 return{lvl:1,q:T`What is the sum of the first $${n}$ terms of the arithmetic sequence $${a1},\ ${a1+d},\ ${a1+2*d},\ \dots$?`,
 a:S,w:[S-an,S+an+d,n*(a1+an),S+n*d,S-n],
 s:T`Here $d=${d}$. The ${ord(n)} term is $a_{${n}}=${a1}+${n-1}\cdot${P(d)}=${an}$.<br>Sum $=$ count × average $=${n}\cdot\dfrac{${a1}+${P(an)}}{2}=${S}$.`}},
r=>{const A=ri(r,1,6)*pick(r,[1,1,-1]),B=ri(r,-10,10),k=ri(r,5,30);const S=n=>A*n*n+B*n;const ak=S(k)-S(k-1);
 return{lvl:2,q:T`The sum of the first $n$ terms of a sequence is $S_n=${poly([[A,2],[B,1]])}$ for every positive integer $n$. What is the ${ord(k)} term?`,
 a:ak,w:[S(k),ak+2*A,ak-2*A,2*A*k+B,ak+A],
 s:T`$a_{${k}}=S_{${k}}-S_{${k-1}}=${S(k)}-${P(S(k-1))}=${ak}$.<br>In general $a_n=S_n-S_{n-1}=${poly([[2*A,1],[B-A,0]])}$, an arithmetic sequence with $d=2\cdot${P(A)}=${2*A}$.`}},
r=>{const m=ri(r,3,13),L=ri(r,10,200),U=L+ri(r,150,900);const f=Math.ceil(L/m)*m,l=Math.floor(U/m)*m,c=(l-f)/m+1,S=c*(f+l)/2;
 return{lvl:1,q:T`What is the sum of all multiples of $${m}$ from $${L}$ to $${U}$, inclusive?`,
 a:S,w:[S-l,S+l+m,S-f,S+f-m,c*(f+l)],
 s:T`The first multiple of ${m} that is at least ${L} is $${f}$; the last that is at most ${U} is $${l}$.<br>Count $=\frac{${l}-${f}}{${m}}+1=${c}$. Sum $=${c}\cdot\dfrac{${f}+${l}}{2}=${S}$.`}},
r=>{let d=0;while(!d)d=ri(r,-7,9);const a1=ri(r,-10,30),n=ri(r,8,40);const S=n*(2*a1+(n-1)*d)/2;
 return{lvl:1,q:T`An arithmetic sequence has first term $${a1}$, and the sum of its first $${n}$ terms is $${S}$. What is the common difference?`,
 a:d,w:[d+1,d-1,2*d,-d,d+2],
 s:T`$S_n=\dfrac n2\left[2a_1+(n-1)d\right]$: $${S}=\dfrac{${n}}{2}\left[${2*a1}+${n-1}d\right]$.<br>So $${2*a1}+${n-1}d=${2*S/n}$, giving $${n-1}d=${2*S/n-2*a1}$ and $d=${d}$.`}},
r=>{const m=ri(r,6,20);let am=0;while(!am)am=ri(r,-20,40);const i=ri(r,1,m-1),j=2*m-i,X=2*am,N=2*m-1;

 s:T`Since $${i}+${j}=2\cdot${m}$, $a_{${i}}+a_{${j}}=2a_{${m}}$, so $a_{${m}}=${am}$.<br>With $${N}$ terms the middle term is $a_{${m}}$, and the sum is (count) × (middle term) $=${N}\cdot${P(am)}=${N*am}$.`}},

GENS.geo=[
r=>{const a1=ri(r,1,6)*pick(r,[1,-1]),q=pick(r,[2,3,-2,-3,4,5]);let n=ri(r,4,9);while(Math.abs(a1*q**(n-1))>2e6)n--;const an=a1*q**(n-1);
 return{lvl:1,q:T`A geometric sequence has first term $${a1}$ and common ratio $${q}$. What is its ${ord(n)} term?`,
 a:an,w:[an*q,an/q,-an,a1+(n-1)*q,a1*q*(n-1)],
 s:T`$a_n=a_1r^{n-1}$, so $a_{${n}}=${a1}\cdot${P(q)}^{${n-1}}=${a1}\cdot${P(q**(n-1))}=${an}$.<br><b>Trap:</b> the exponent is $n-1$, not $n$.`}},
r=>{const a1=ri(r,1,6),q=pick(r,[2,3,4,5]),p=ri(r,1,3),g=pick(r,[1,2,3]);const qq=p+g;let s=qq+ri(r,1,3);while(a1*q**(s-1)>5e7)s--;if(s<=qq)s=qq+1;
 const t=n=>a1*q**(n-1);const as=t(s);
 return{lvl:1,q:T`A geometric sequence of positive numbers has ${ord(p)} term $${t(p)}$ and ${ord(qq)} term $${t(qq)}$. What is its ${ord(s)} term?`,
 a:as,w:[as*q,as/q,t(qq)+(s-qq)*(t(qq)-t(p)),as*q*q,as+q],
 s:T`$r^{${qq}-${p}}=\dfrac{${t(qq)}}{${t(p)}}=${q**g}$, so $r=${q}$ (positive terms).<br>$a_{${s}}=a_{${qq}}\cdot r^{${s-qq}}=${t(qq)}\cdot${q**(s-qq)}=${as}$.`}},
r=>{const a=ri(r,1,5),q=pick(r,[2,3,-2,-3]),n=ri(r,5,10);const S=a*(q**n-1)/(q-1);
 const terms=[a,a*q,a*q*q];
 return{lvl:1,q:T`What is the sum of the first $${n}$ terms of the geometric sequence $${terms.join(',\\ ')},\ \dots$?`,
 a:S,w:[a*(q**(n+1)-1)/(q-1),a*(q**(n-1)-1)/(q-1),a*(q**n-1),a*q**(n-1),S+1],

r=>{const e=ri(r,-4,3),f=pick(r,[1,2]),n=ri(r,5,10);const E=n*e+f*n*(n-1)/2;const pw=k=>({tex:'2^{'+k+'}',v:k});

r=>{const a=ri(r,1,4),q=pick(r,[2,3]),n=ri(r,5,12);const S=k=>a*(q**k-1)/(q-1);const X=ri(r,S(n-1),S(n)-1);

r=>{const ak=ri(r,2,40),k=ri(r,5,12),m=ri(r,1,k-1);const Pp=ak*ak;

GENS.sigma=[

r=>{const m=ri(r,2,15),n=ri(r,m+8,40);const S=sq(n)-sq(m-1);

 s:T`$\sum_i\sum_j i=${n}\cdot\frac{${m}\cdot${m+1}}2=${n*tri(m)}$ and $\sum_i\sum_j j=${m}\cdot\frac{${n}\cdot${n+1}}2=${m*tri(n)}$. Total $${S}$.`}}

GENS.tele=[

 const alt1=F(1,a+b).sub(F(1,a*n+a+b)),altN=F(1,a).mul(F(1,a+b).sub(F(1,a*n+b)));
 return{lvl:a===1?1:2,q:T`Evaluate $${tm(1)}+${tm(2)}+${tm(3)}+\cdots+${tm(n)}$.`,
 a:S,w:[a===1?S.add(F(1,f(n)*(f(n)+a))):alt1,altN,F(1,a).mul(F(1,a+b).sub(F(1,a*n+2*a+b))),F(1,a).mul(F(1,a+b)),S.mul(2)],

r=>{const n=ri(r,5,60);const S=F(2*n,n+1);

GENS.recur=[
r=>{const p=pick(r,[2,3,-2,2,3]);let q=0;while(!q)q=ri(r,-5,5);const a1=ri(r,-3,5),k=ri(r,5,8);const s=[a1];for(let i=1;i<k+1;i++)s.push(p*s[i-1]+q);const ak=s[k-1];
 const L=F(q,1-p);
 return{lvl:1,q:T`A sequence has $a_1=${a1}$ and $a_{n+1}=${p}a_n${q<0?'-':'+'}${Math.abs(q)}$ for $n\ge1$. What is $a_{${k}}$?`,
 a:ak,w:[s[k-2],s[k],ak+q,ak-q,p*ak],
 s:T`Compute: $${s.slice(0,k).join(',\\ ')}$, so $a_{${k}}=${ak}$.<br>Closed form: the fixed point $L=\frac{${q}}{1-${P(p)}}=${L.tex()}$ makes $a_n-L$ geometric with ratio ${p}: $a_n=${L.tex()}+${P(p)}^{n-1}\left(${a1}-${P(L)}\right)$.`}},
r=>{const a=pick(r,[F(2),F(3),F(-1),F(4),F(5),F(-2),F(-3),F(1,2),F(1,3),F(3,2)]);const cyc=[a,F(1).div(F(1).sub(a)),a.sub(1).div(a)];const N=ri(r,100,3000);const ans=cyc[(N-1)%3];
 return{lvl:1,q:T`A sequence has $a_1=${a.tex()}$ and $a_{n+1}=\dfrac{1}{1-a_n}$. What is $a_{${N}}$?`,
 a:ans,w:[cyc[N%3],cyc[(N+1)%3],ans.neg(),F(1).div(ans),F(1).sub(ans)],
 s:T`$a_1=${a.tex()},\ a_2=${cyc[1].tex()},\ a_3=${cyc[2].tex()},\ a_4=${a.tex()}$. The period is $3$.<br>$${N}=3\cdot${Math.floor((N-1)/3)}+${(N-1)%3+1}$, so $a_{${N}}=a_{${(N-1)%3+1}}=${ans.tex()}$.`}},
r=>{let x=ri(r,-5,9),y=ri(r,-5,9);if(x===0&&y===0)y=3;const N=ri(r,50,2030);const s=[x,y];for(let i=2;i<6;i++)s.push(s[i-1]-s[i-2]);const rem=N%6;const S=s.slice(0,rem).reduce((u,v)=>u+v,0);
 const part=k=>s.slice(0,k).reduce((u,v)=>u+v,0);
 return{lvl:2,q:T`A sequence has $a_1=${x}$, $a_2=${y}$, and $a_n=a_{n-1}-a_{n-2}$ for $n\ge3$. What is $a_1+a_2+\cdots+a_{${N}}$?`,
 a:S,w:[0,part((rem+1)%6),part((rem+2)%6),part((rem+3)%6),part((rem+4)%6),x+y,part((rem+5)%6)],
 s:T`Terms: $${s.join(',\\ ')},\ ${x},\ ${y},\dots$ Period $6$, and each block of 6 sums to $0$.<br>$${N}=6\cdot${Math.floor(N/6)}+${rem}$, so the sum equals the first ${rem} term${rem===1?'':'s'}: ${rem?'$'+s.slice(0,rem).map(P).join('+')+'='+S+'$':'$0$'}.`}},
r=>{const u=ri(r,1,5)*pick(r,[1,1,-1]),v=ri(r,-6,6),c=ri(r,-5,10),k=ri(r,10,40);const ak=c+u*tri(k-1)+v*(k-1);
 return{lvl:1,q:T`A sequence has $a_1=${c}$ and $a_{n+1}=a_n+${u===1?'':u===-1?'-':u}n${v<0?'-':'+'}${Math.abs(v)}$ for $n\ge1$. What is $a_{${k}}$?`,

r=>{const x=ri(r,2,9);let y=ri(r,2,9);while(y===x)y=ri(r,2,9);const cyc=[F(x),F(y),F(y,x),F(1,x),F(1,y),F(x,y)];const N=ri(r,100,3000);const ans=cyc[(N-1)%6];

 s:T`Take reciprocals: $\dfrac1{x_{n+1}}=\dfrac{1+${c===1?'':c}x_n}{x_n}=\dfrac1{x_n}+${c}$. So $\frac1{x_n}$ is arithmetic: $\frac1{x_n}=${b}+${c}(n-1)$.<br>$\frac1{x_{${N}}}=${b}+${c}\cdot${N-1}=${val}$, so $x_{${N}}=\frac1{${val}}$.`}},

GENS.fib=[
r=>{const n=ri(r,6,20);const ctx=pick(r,[['A staircase has '+n+' steps. In how many ways can you climb it if each move goes up 1 or 2 steps?','w'],
 ['In how many ways can a $1\\times'+n+'$ strip be tiled with $1\\times1$ squares and $1\\times2$ dominoes?','t'],['In how many ways can a $2\\times'+n+'$ rectangle be tiled with $1\\times2$ dominoes?','d']]);
 return{lvl:1,q:ctx[0],a:fib[n+1],w:[fib[n],fib[n+2],2**(n-1),n*n,fib[n+1]+1],
 s:T`Let $w_k$ be the count for length $k$. Looking at the last move/tile: it is a "1" (leaving $k-1$) or a "2" (leaving $k-2$). So $w_k=w_{k-1}+w_{k-2}$ with $w_1=1,\ w_2=2$.<br>This gives $w_k=F_{k+1}$, so $w_{${n}}=F_{${n+1}}=${fib[n+1]}$.`}},
r=>{const [al,be]=pick(r,[[1,2],[2,3],[1,3],[-1,2],[-1,3],[-2,3],[2,-3],[1,-2]]);const p=al+be,q=-al*be;const a0=ri(r,0,4),a1=ri(r,1,6),k=ri(r,5,8);
 const s=[a0,a1];for(let i=2;i<=k+1;i++)s.push(p*s[i-1]+q*s[i-2]);const B=F(a1-al*a0,be-al),A=F(a0).sub(B);
 return{lvl:2,q:T`A sequence satisfies $a_n=${p}a_{n-1}${q<0?'-':'+'}${Math.abs(q)}a_{n-2}$ for $n\ge2$, with $a_0=${a0}$ and $a_1=${a1}$. What is $a_{${k}}$?`,
 a:s[k],w:[s[k-1],s[k+1],s[k]+p,s[k]-q,2*s[k]],
 s:T`Iterate: $${s.slice(0,k+1).join(',\\ ')}$, so $a_{${k}}=${s[k]}$.<br>Closed form: $x^2=${p}x${q<0?'-':'+'}${Math.abs(q)}$ has roots $${al}$ and $${be}$, so $a_n=${A.tex()}\cdot${P(al)}^n+${P(B)}\cdot${P(be)}^n$.`}},
r=>{const n=ri(r,8,25);
 return{lvl:1,q:T`With $F_1=F_2=1$ and $F_n=F_{n-1}+F_{n-2}$, what is $F_1+F_2+\cdots+F_{${n}}$?`,
 a:fib[n+2]-1,w:[fib[n+2],fib[n+1]-1,fib[n+1],fib[n+3]-1],
 s:T`Identity: $\sum_{k=1}^nF_k=F_{n+2}-1$ (because $F_k=F_{k+2}-F_{k+1}$ telescopes). So the sum is $F_{${n+2}}-1=${fib[n+2]-1}$.`}},
r=>{const n=ri(r,5,15);const q=r()<.5?T`How many binary strings of length $${n}$ contain no two consecutive $1$s?`:T`How many subsets of $\{1,2,\dots,${n}\}$ (including the empty set) contain no two consecutive integers?`;
 return{lvl:1,q,a:fib[n+2],w:[fib[n+1],fib[n+3],2**n-fib[n],2**(n-1),fib[n+2]-1],
 s:T`Condition on the last position: if it is "off", any valid object of size $n-1$ works; if it is "on", the previous one must be off, leaving size $n-2$. So $c_n=c_{n-1}+c_{n-2}$ with $c_1=2,\ c_2=3$, which gives $c_n=F_{n+2}$.<br>$c_{${n}}=F_{${n+2}}=${fib[n+2]}$.`}},
r=>{const a=ri(r,1,9),b=ri(r,1,9);const x=[0,a,b];for(let i=3;i<=7;i++)x.push(x[i-1]+x[i-2]);
 return{lvl:2,q:T`A sequence satisfies $x_{n+2}=x_{n+1}+x_n$ for all $n\ge1$. If $x_6=${x[6]}$ and $x_7=${x[7]}$, what is $x_1$?`,
 a:a,w:[b,x[3],x[2]+1,x[7]-x[6]-x[5]+a+1,Math.abs(a-b)+1],
 s:T`Run the recurrence backwards with $x_n=x_{n+2}-x_{n+1}$:<br>$x_5=${x[7]}-${x[6]}=${x[5]}$, $x_4=${x[6]}-${x[5]}=${x[4]}$, $x_3=${x[3]}$, $x_2=${x[2]}$, $x_1=${a}$.`}},
r=>{const N=ri(r,100,3000);const m=N%60;let a=0,b=1;for(let i=0;i<m;i++){[a,b]=[b,(a+b)%10]}const d=a;

/* ====================== content model ====================== */
const SET_SIZE=50;
let BANK={},SETS={};

function parseBank(txt){
  const bank={};
  for(const sec of txt.split(/^@@\s*/m).slice(1)){
    const nl=sec.indexOf('\n');const sub=sec.slice(0,nl).trim();bank[sub]=[];
    for(const blk of sec.slice(nl+1).split(/^---\s*$/m)){
      const f={W:[]};let key=null;
      for(const line of blk.split(/\r?\n/)){
        const m=line.match(/^([QALWS]):\s?(.*)$/);
        if(m){key=m[1];if(key==='W')f.W.push(m[2]);else f[key]=m[2]}
        else if(key&&line.trim()!==''){if(key==='W')f.W[f.W.length-1]+='\n'+line;else f[key]+='\n'+line}
      }
      if(f.Q)bank[sub].push(f);
    }
  }
  return bank;
}
const fmt=s=>(s||'').trim().split(/\r?\n/).join('<br>');
const wrapM=s=>{s=s.trim();return s.includes('$')?s:'$'+s+'$'};

function mkClassic(sub,f,i){
  const id=sub+'-c'+(i+1);const r=rng(hash(id));
  const all=[f.A,...f.W].map(wrapM);const order=shuffle(r,[0,1,2,3,4]);
  return{id,sub,src:'c',lvl:+f.L||2,q:fmt(f.Q),choices:order.map(k=>all[k]),ans:order.indexOf(0),sol:fmt(f.S)};
}
function mkGen(sub,gen,seed,id){
  const r=rng(seed);const g=gen(r);const b=build(g.a,g.w);
  return{id,sub,src:'g',lvl:g.lvl||1,q:g.q,choices:b.choices,ans:b.ans,sol:g.s};
}
function buildSet(sub){
  const classics=(BANK[sub]||[]).map((f,i)=>mkClassic(sub,f,i));
  const gens=GENS[sub]||[];const out=classics.slice();const seen=new Set(out.map(x=>x.q));
  let n=0;
  while(gens.length&&out.length<Math.max(SET_SIZE,classics.length+20)&&n<3000){
    const g=gens[n%gens.length];const it=mkGen(sub,g,hash(sub+'#'+n),sub+'-g'+n);n++;
    if(seen.has(it.q))continue;seen.add(it.q);out.push(it);
  }
  return out;
}
function loadData(bankText){BANK=parseBank(bankText);for(const s of SUBS)SETS[s.id]=buildSet(s.id)}
function freshGen(sub,count){
  const gens=GENS[sub];const out=[];const base=(Date.now()^Math.floor(Math.random()*1e9))>>>0;
  for(let i=0;out.length<count&&i<count*5;i++){const g=gens[Math.floor(Math.random()*gens.length)];const it=mkGen(sub,g,base+i*7919,'p'+base+'-'+i);if(!out.some(o=>o.q===it.q))out.push(it)}
  return out;
}

  function draw(){
    const items=set.map((it,i)=>[it,i+1]).filter(([it])=>{const p=PROG.q[it.id];
      if(filter==='all')return true;if(filter==='c'||filter==='g')return it.src===filter;if(filter==='new')return!p;if(filter==='miss')return p&&!p.ok;return String(it.lvl)===filter});
    list.innerHTML=items.length?items.map(([it,n])=>cardHTML(it,n)).join(''):'<div class="empty">No problems match this filter.</div>';
    for(const [it] of items){const p=PROG.q[it.id];if(p)revealCard(list.querySelector(`[data-id="${it.id}"]`),it,p.c,false)}
    renderMath(list);
  }
  list.addEventListener('click',e=>{const b=e.target.closest('.ch');if(!b||b.disabled)return;const card=b.closest('.prob');const it=set.find(x=>x.id===card.dataset.id);
    const c=+b.dataset.i;PROG.q[it.id]={c,ok:c===it.ans};saveProg();revealCard(card,it,c,c!==it.ans);body.querySelector('#sstat').innerHTML=statHTML()});
  body.querySelector('#flt').addEventListener('click',e=>{const b=e.target.closest('.chip');if(!b)return;
    if(b.id==='resetset'){if(confirm('Clear your answers for this problem set?')){for(const it of set)delete PROG.q[it.id];saveProg();setView(sid,body)}return}
    filter=b.dataset.f;body.querySelectorAll('#flt .chip[data-f]').forEach(x=>x.classList.toggle('on',x===b));draw()});
  draw();
}

/* ---------- practice mode ---------- */
function practiceSetup(sid,body){
  const hist=PROG.pr[sid];
  body.innerHTML=`<div class="card">
  <h3 style="margin-top:4px">Practice Mode</h3>
  <p class="meta" style="font-size:14.5px">Each session gives you a <b>fresh, randomized</b> set of questions: hand-written AMC-style problems mixed with newly generated drills, so the numbers change every time. Answer one question at a time and get instant feedback with a full solution.</p>
  <div class="opt"><label class="h">Number of questions</label><div class="filters" data-o="n">${[10,15,25,50].map(n=>`<button class="chip ${n===15?'on':''}" data-v="${n}">${n}</button>`).join('')}</div></div>
  <div class="opt"><label class="h">Question mix</label><div class="filters" data-o="mix">${[['mix','AMC-style + drills'],['c','AMC-style only'],['g','Fresh drills only']].map(([k,n],i)=>`<button class="chip ${i===0?'on':''}" data-v="${k}">${n}</button>`).join('')}</div></div>
  <div class="opt"><label class="h">Timer</label><div class="filters" data-o="timer">${[['off','Untimed'],['amc','AMC pace (3 min / question)'],['fast','Speed (90 s / question)']].map(([k,n],i)=>`<button class="chip ${i===0?'on':''}" data-v="${k}">${n}</button>`).join('')}</div></div>
  <div class="row"><button class="btn pri" id="go">Start practice</button>${hist?`<span class="meta">Lifetime practice: ${hist.c}/${hist.t} correct (${Math.round(hist.c/hist.t*100)}%) over ${hist.s} session${hist.s>1?'s':''}</span>`:''}</div></div>`;
  const cfg={n:15,mix:'mix',timer:'off'};
  body.querySelectorAll('[data-o]').forEach(g=>g.addEventListener('click',e=>{const b=e.target.closest('.chip');if(!b)return;g.querySelectorAll('.chip').forEach(x=>x.classList.toggle('on',x===b));const k=g.dataset.o;cfg[k]=k==='n'?+b.dataset.v:b.dataset.v}));
  body.querySelector('#go').onclick=()=>{
    const classics=shuffle(Math.random,SETS[sid].filter(x=>x.src==='c'));let items=[];
    if(cfg.mix==='c'){while(items.length<cfg.n&&classics.length)items.push(classics.shift());if(items.length<cfg.n)items=items.concat(freshGen(sid,cfg.n-items.length))}
    else if(cfg.mix==='g')items=freshGen(sid,cfg.n);
    else{const nc=Math.min(classics.length,Math.ceil(cfg.n/2));items=classics.slice(0,nc).concat(freshGen(sid,cfg.n-nc));items=shuffle(Math.random,items)}
    items.sort((a,b)=>a.lvl-b.lvl);
    runPractice(sid,body,items,cfg);
  };
}
function runPractice(sid,body,items,cfg){
  const N=items.length;const res=new Array(N).fill(undefined);let idx=0,sel=null,locked=false;
  const total=cfg.timer==='amc'?N*180:cfg.timer==='fast'?N*90:0;const t0=Date.now();
  body.innerHTML=`<div class="row" style="margin-bottom:12px"><b id="pcount"></b><span class="meta" id="pscore"></span><span class="spacer"></span>${total?'<span class="timer" id="ptimer"></span>':''}<button class="btn sm" id="pquit">End session</button></div>
  <div id="pq"></div><div class="row" style="margin-top:4px"><button class="btn" id="pskip">Skip</button><span class="spacer"></span><span class="kbd">Keys: A–E choose · Enter submit/next</span><button class="btn pri" id="pgo" disabled>Submit</button></div>`;
  const pq=body.querySelector('#pq'),go=body.querySelector('#pgo'),skip=body.querySelector('#pskip');
  function show(){
    sel=null;locked=false;const it=items[idx];
    body.querySelector('#pcount').textContent=`Question ${idx+1} of ${N}`;
    const c=res.filter(x=>x&&x.r==='ok').length;body.querySelector('#pscore').textContent=`${c} correct so far`;
    pq.innerHTML=cardHTML(it,idx+1);renderMath(pq);go.textContent='Submit';go.disabled=true;skip.disabled=false;
  }
  function choose(i){if(locked)return;sel=i;pq.querySelectorAll('.ch').forEach(b=>b.classList.toggle('sel',+b.dataset.i===i));go.disabled=false}
  function submit(skipped){
    if(locked){idx++;if(idx>=N)return finish();return show()}
    const it=items[idx];const c=skipped?null:sel;res[idx]={c,r:c===null?'blank':c===it.ans?'ok':'no'};
    if(PROG.q.hasOwnProperty(it.id)===false&&it.src==='c'&&c!==null){PROG.q[it.id]={c,ok:c===it.ans};saveProg()}
    locked=true;revealCard(pq.querySelector('.prob'),it,c,c!==it.ans);renderMath(pq);
    go.disabled=false;go.textContent=idx===N-1?'See results':'Next →';skip.disabled=true;
  }
  pq.addEventListener('click',e=>{const b=e.target.closest('.ch');if(b&&!b.disabled)choose(+b.dataset.i)});
  go.onclick=()=>submit(false);skip.onclick=()=>submit(true);
  body.querySelector('#pquit').onclick=()=>{if(confirm('End this session and see results?'))finish()};
  keyHandler=e=>{if(/INPUT|TEXTAREA/.test(e.target.tagName)||document.querySelector('.tm-sheet.open'))return;const k=e.key.toUpperCase();const i=L.indexOf(k);if(i>=0&&k.length===1&&!locked)choose(i);else if(e.key==='Enter'&&!go.disabled){e.preventDefault();go.click()}};
  document.addEventListener('keydown',keyHandler);
  if(total){const tEl=body.querySelector('#ptimer');const tick=()=>{const left=total-(Date.now()-t0)/1000;tEl.textContent='⏱ '+fmtTime(left);tEl.classList.toggle('low',left<60);if(left<=0){clearInterval(timerHandle);timerHandle=null;alert("Time's up!");finish()}};tick();timerHandle=setInterval(tick,1000)}
  function finish(){
    cleanup();const ok=res.filter(x=>x&&x.r==='ok').length,no=res.filter(x=>x&&x.r==='no').length,blank=N-ok-no;
    const answered=ok+no;const h=PROG.pr[sid]||{c:0,t:0,s:0};h.c+=ok;h.t+=answered||0;h.s++;if(h.t>0){PROG.pr[sid]=h;saveProg()}
    const secs=(Date.now()-t0)/1000;
    body.innerHTML=`<div class="card"><h3 style="margin-top:4px">Session results</h3>
     <div class="stat"><div><b>${ok}/${N}</b><span>correct</span></div><div><b>${N?Math.round(ok/N*100):0}%</b><span>score</span></div><div><b>${(ok*6+blank*1.5).toFixed(1)}</b><span>AMC points (of ${N*6})</span></div><div><b>${fmtTime(secs)}</b><span>time used</span></div></div>
     <div class="row"><button class="btn pri" id="again">New session</button><button class="btn" onclick="location.hash='#/s/${sid}/lesson'">Review lesson</button></div></div>
     <h3>Review</h3><div id="rev"></div>`;
    const rev=body.querySelector('#rev');
    rev.innerHTML=items.map((it,i)=>cardHTML(it,i+1)).join('');
    items.forEach((it,i)=>{const el=rev.children[i];const r_=res[i];revealCard(el,it,r_?r_.c:null,false);
      if(!r_){el.querySelector('.fb').textContent='Not reached. The answer is ('+L[it.ans]+').'}});
    renderMath(rev);body.querySelector('#again').onclick=()=>practiceSetup(sid,body);
  }
  show();
}


/* ---------- mock test ---------- */
function mockPage(scope){
  const t=scope==='all'?null:findTopic(scope);const name=t?t.name:'All Topics';
  setCrumbs(t?[['Home','#/home'],[t.name,'#/t/'+t.id],['Mock Test']]:[['Home','#/home'],['Full Mock Test']]);
  const hist=PROG.mock.filter(m=>(m.topic||'seq')===scope).slice(-5).reverse();
  app.innerHTML=`<h1>${t?esc(name)+' Mock Test':'Full AMC Mock Exam'}</h1><p class="sub">25 multiple-choice questions${t?' on '+esc(name):' drawn from every topic'}, ordered from easier to harder like a real AMC 10/12. You have 75 minutes. Scoring: 6 points for a correct answer, 1.5 for a blank, 0 for a wrong answer.</p>
   <div class="card"><div class="row"><button class="btn pri" id="mstart">Start test</button><span class="meta">Questions are drawn at random, so each attempt is different.</span></div>
   ${hist.length?`<h4 style="margin-top:16px">Recent scores</h4>${hist.map(h=>`<div class="meta">${new Date(h.at).toLocaleString()} — <b>${h.score}</b> / 150 (${h.ok} correct, ${h.blank} blank)</div>`).join('')}`:''}</div>`;
  app.querySelector('#mstart').onclick=()=>startMock(scope);
}
function startMock(scope){
  const t=scope==='all'?null:findTopic(scope);const subs=t?t.subs:SUBS;
  const classics=[],drills=[];for(const s of subs)for(const it of SETS[s.id]||[])(it.src==='c'?classics:drills).push(it);
  const used=new Set();
  const take=(arr,n)=>{const o=[];for(const x of shuffle(Math.random,arr)){if(o.length>=n)break;if(!used.has(x.id)){used.add(x.id);o.push(x)}}return o};
  const pick=(lvl,n)=>{let o=take(classics.filter(x=>x.lvl===lvl),n);if(o.length<n)o=o.concat(take(drills.filter(x=>x.lvl===lvl),n-o.length));return o};
  let items=pick(1,9).concat(pick(2,10),pick(3,6));
  if(items.length<25)items=items.concat(take(classics,25-items.length));
  if(items.length<25)items=items.concat(take(drills,25-items.length));
  items.sort((a,b)=>a.lvl-b.lvl);
  const N=items.length;const ans=new Array(N).fill(null);const total=75*60;const t0=Date.now();
  app.innerHTML=`<div class="row" style="position:sticky;top:58px;z-index:5;background:var(--bg);padding:8px 0"><h1 style="margin:0">Mock Test</h1><span class="spacer"></span><span class="meta" id="mans">0/${N} answered</span><span class="timer" id="mtimer"></span><button class="btn pri" id="msubmit">Submit test</button></div>
   <p class="meta">Click a choice to select it; click it again to clear it (a blank is worth 1.5 points). Nothing is graded until you submit.</p><div id="mlist">${items.map((it,i)=>cardHTML(it,i+1)).join('')}</div>
   <div class="row"><span class="spacer"></span><button class="btn pri" id="msubmit2">Submit test</button></div>`;
  renderMath(app);
  const list=app.querySelector('#mlist');
  list.addEventListener('click',ev=>{const b=ev.target.closest('.ch');if(!b||b.disabled)return;const card=b.closest('.prob');const qi=[...list.children].indexOf(card);const i=+b.dataset.i;
    ans[qi]=ans[qi]===i?null:i;card.querySelectorAll('.ch').forEach(x=>x.classList.toggle('sel',+x.dataset.i===ans[qi]));
    app.querySelector('#mans').textContent=ans.filter(x=>x!==null).length+'/'+N+' answered'});
  const tEl=app.querySelector('#mtimer');
  const tick=()=>{const left=total-(Date.now()-t0)/1000;tEl.textContent='⏱ '+fmtTime(left);tEl.classList.toggle('low',left<300);if(left<=0){finish(true)}};tick();timerHandle=setInterval(tick,1000);
  const ask=()=>{const blanks=ans.filter(x=>x===null).length;if(confirm(blanks?`Submit with ${blanks} blank answer(s)?`:'Submit your test?'))finish(false)};
  app.querySelector('#msubmit').onclick=ask;app.querySelector('#msubmit2').onclick=ask;
  function finish(timeUp){
    cleanup();let ok=0,blank=0;items.forEach((it,i)=>{if(ans[i]===null)blank++;else if(ans[i]===it.ans)ok++});const wrong=N-ok-blank;const score=ok*6+blank*1.5;
    PROG.mock.push({at:Date.now(),score,ok,blank,topic:scope});saveProg();
    const secs=Math.min(total,(Date.now()-t0)/1000);
    const groups=t?t.subs.map(s=>[s.name,it=>it.sub===s.id]):TOPICS.map(x=>[x.name,it=>subById(it.sub).topic===x.id]);
    app.innerHTML=`<h1>Mock Test Results</h1>${timeUp?'<p class="sub">Time ran out, so the test was submitted automatically.</p>':''}
     <div class="stat"><div><b>${score}</b><span>score / 150</span></div><div><b>${ok}</b><span>correct</span></div><div><b>${wrong}</b><span>wrong</span></div><div><b>${blank}</b><span>blank</span></div><div><b>${fmtTime(secs)}</b><span>time used</span></div></div>
     <div class="card" style="margin-bottom:16px"><b>By ${t?'subtopic':'topic'}:</b> ${groups.map(([nm,f])=>{const its=items.map((it,i)=>[it,i]).filter(([it])=>f(it));if(!its.length)return'';const c=its.filter(([it,i])=>ans[i]===it.ans).length;return`<span class="pill ${c===its.length?'ok':c?'':'no'}" style="margin:3px">${esc(nm)} ${c}/${its.length}</span>`}).join('')}
     <div class="row" style="margin-top:12px"><button class="btn pri" id="again">Take another test</button><button class="btn" onclick="location.hash='${t?'#/t/'+t.id:'#/home'}'">Back</button></div></div>
     <div id="mrev">${items.map((it,i)=>cardHTML(it,i+1,{extra:`<span class="meta">${esc(subById(it.sub).name)}</span>`})).join('')}</div>`;
    app.querySelector('#again').onclick=()=>startMock(scope);
    const rev=app.querySelector('#mrev');items.forEach((it,i)=>revealCard(rev.children[i],it,ans[i],false));renderMath(app);window.scrollTo(0,0);
  }
}

/* ====================== boot ====================== */
if(typeof document!=='undefined'&&document.getElementById('bank')){
  app=document.getElementById('app');crumbs=document.getElementById('crumbs');
  loadData(document.getElementById('bank').textContent);loadProg();
  window.addEventListener('hashchange',route);route();
}
